<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application - Tullu Rajota Orthodox Tewahdo Church</title>
    <style>
        :root {
            --primary-color: #1d4ed8;
            --primary-hover: #1e40af;
            --accent-color: #d97706; /* Warm gold touch */
            --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #fef3c7 100%);
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(29, 78, 216, 0.12);
            width: 100%;
            max-width: 650px;
            border-top: 6px solid var(--primary-color);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-color);
            font-size: 24px;
        }

        h3.church-title {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent-color);
            font-size: 17px;
            font-weight: 600;
        }

        p.subtitle {
            color: #4b5563;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.15);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        input[type="file"] {
            font-size: 14px;
            color: #4b5563;
            padding: 8px;
            background-color: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
        }

        button[type="submit"]:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Employment & Service Application<br><span style="font-size: 18px; font-weight: 500; color: #3b82f6;">Gaaffii Hojii & Tajaajilaa</span></h2>
    <h3 class="church-title">Tullu Rajota Orthodox Tewahdo Church</h3>
    <p class="subtitle">
        Please fill out the form below to apply for an open position or service role.<br>
        <em>Bakka duwwaa hojii ykn gahee tajaajilaaf iyyachuuf maaloo foomii armaan gadii guutaa.</em>
    </p>
    
    <form id="jobApplicationForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="fullName">Full Name / Maqaa Guutuu</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe / Maqaa Keessan">
        </div>

        <div class="form-group">
            <label for="email">Email Address / Teessoo Iimeelii</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number / Lakkoofsa Bilbilaa</label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 000-0000">
        </div>

        <div class="form-group">
            <label for="position">Position / Ministry Role / Gahee Tajaajilaa</label>
            <select id="position" name="position" required>
                <option value="">-- Select Role / Gahee Filadhu --</option>
                <option value="Sunday School Teacher">Sunday School Teacher / Barsiisaa Mana Sagaltichaa</option>
                <option value="Choir Member / Zema Leader">Choir Member / Zema Leader / Miseensa Faarfannaa</option>
                <option value="Church Administrator">Church Administrator / Bulchiinsa Mana Kiristiyaanaa</option>
                <option value="Youth Coordinator">Youth Coordinator / Qindeessaa Dargaggootaa</option>
                <option value="Maintenance / Facilities">Maintenance / Facilities / Suphaa Fi Qindaa'ina</option>
                <option value="Other">Other / Kan Biroo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="experience">Relevant Background / Experience / Muuxannoo Hojichaa</label>
            <input type="text" id="experience" name="experience" required placeholder="e.g., 3 years teaching Sunday school / Fakkeenyaaf waggaa 3">
        </div>

        <div class="form-group">
            <label for="resume">Upload Resume / CV (PDF / DOCX) / CV Ol Fe'aa</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
        </div>

        <div class="form-group">
            <label for="coverLetter">Statement of Intent / Cover Letter / Ergaa Gabaabaa</label>
            <textarea id="coverLetter" name="coverLetter" placeholder="Tell us about your background with the church and why you wish to serve... / Maaliif tajaajiluu akka barbaaddan barreessaa..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit Application / Ergi</button>
        <div id="status-message"></div>
    </form>
</div>

<script>
    const form = document.getElementById("jobApplicationForm");
    
    async function handleSubmit(event) {
        event.preventDefault();
        const status = document.getElementById("status-message");
        const btn = document.getElementById("submitBtn");
        
        btn.textContent = "Sending / Ergaa jira...";
        btn.disabled = true;
        
        const data = new FormData(event.target);
        
        fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'json'
            }
        }).then(response => {
            if (response.ok) {
                status.style.color = "#10b981";
                status.textContent = "Success! Your application has been submitted. / Milkaa'eera! Iyyatni keessan dhiyaateera.";
                form.reset();
            } else {
                response.json().then(data => {
                    if (Object.hasOwn(data, 'errors')) {
                        status.style.color = "#ef4444";
                        status.textContent = data["errors"].map(error => error["message"]).join(", ");
                    } else {
                        status.style.color = "#ef4444";
                        status.textContent = "Oops! There was a problem submitting your form. / Rakkoo uumameen iyyatni hin dabarsamne.";
                    }
                })
            }
            btn.textContent = "Submit Application / Ergi";
            btn.disabled = false;
        }).catch(error => {
            status.style.color = "#ef4444";
            status.textContent = "Oops! There was a problem submitting your form. / Rakkoo uumameen iyyatni hin dabarsamne.";
            btn.textContent = "Submit Application / Ergi";
            btn.disabled = false;
        });
    }
    
    form.addEventListener("submit", handleSubmit);
</script>

</body>
</html>
